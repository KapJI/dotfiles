{{ $default_refresh := "168h" | quote }}

{{ $binary_suffix := "" }}
{{ if eq .osid "windows" }}
{{ $binary_suffix = ".exe" }}
{{ end }}

[".config/eza/theme.yml"]
    type = "file"
    url = "https://raw.githubusercontent.com/eza-community/eza-themes/refs/heads/main/themes/catppuccin-mocha.yml"
    refreshPeriod = {{ $default_refresh }}

{{ if ne .osid "windows" }}
# Yazi catppuccin-mocha-blue theme (yazi is nix-only, so no Windows).
# The catppuccin/yazi repo dropped flavor.yazi packs in favor of single
# .toml files; we just rename the chosen one to theme.toml at fetch time.
[".config/yazi/theme.toml"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/yazi/main/themes/mocha/catppuccin-mocha-blue.toml"
    refreshPeriod = {{ $default_refresh }}

# tmTheme for yazi's preview-pane syntax highlighting (syntect engine).
# Per catppuccin/yazi README: source the .tmTheme from catppuccin/bat,
# not catppuccin/yazi. Fetched filename is "Catppuccin Mocha.tmTheme"
# but the yazi theme.toml's syntect_theme path is the hyphenated form,
# so we rename at fetch time.
[".config/yazi/Catppuccin-mocha.tmTheme"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/bat/main/themes/Catppuccin%20Mocha.tmTheme"
    refreshPeriod = {{ $default_refresh }}
{{ end }}

{{ if has .osid (list "linux-debian" "linux-ubuntu") }}
# ANSI Shadow figlet font (used by the Linux motd hostname banner;
# see .chezmoiscripts/linux/run_onchange_after_60-install-fastfetch-motd.sh.tmpl).
# Static file from xero/figlet-fonts; refresh yearly since fonts don't change.
[".local/share/figlet-fonts/ANSI Shadow.flf"]
    type = "file"
    url = "https://raw.githubusercontent.com/xero/figlet-fonts/master/ANSI%20Shadow.flf"
    refreshPeriod = "8760h"
{{ end }}


{{ if ne .osid "windows" }}
# antidote (the plugin manager) pinned to a commit SHA for reproducibility,
# like the tmux plugins below and the pin:<sha> on every bundle in
# .zsh_plugins.txt. Fetched as an archive rather than a git clone: with no
# .git, antidote's own `antidote update` self-update no-ops ("self updating is
# disabled in this build"), so the tool version is frozen too and bumps stay
# deliberate. HEAD is 21 commits past the newest tag (v2.1.0) with nothing
# newer published, so this pins the SHA (as mode-indicator does) rather than
# downgrade to the tag. exact = true prunes files a future version would drop,
# and checksum.sha256 makes the fetch byte-exact and tamper-evident. When
# bumping, update BOTH the SHA in the url and the checksum, or the fetch fails:
#   git ls-remote https://github.com/mattmc3/antidote HEAD
#   curl -fsSL <new-url> | sha256sum
[".config/zsh/antidote"]
    type = "archive"
    url = "https://github.com/mattmc3/antidote/archive/67120be33ce52dfbf64278c07bc03f7c10e7eb9d.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "8e4170e07b76358db8322b8efefb17e48c771f8a8f9294495be097507957eacf"
    refreshPeriod = {{ $default_refresh }}
{{ end }}

{{ if eq .osid "windows" }}
["Documents/PowerShell/Completion/bat.ps1"]
    type = "archive-file"
    url = "{{ gitHubLatestReleaseAssetURL "sharkdp/bat" "*x86_64-pc-windows-msvc*" }}"
    stripComponents = 1
    path = "autocomplete/_bat.ps1"
    refreshPeriod = {{ $default_refresh }}

["Documents/PowerShell/Completion/hyperfine.ps1"]
    type = "archive-file"
    url = "{{ gitHubLatestReleaseAssetURL "sharkdp/hyperfine" "*x86_64-pc-windows-msvc*" }}"
    stripComponents = 1
    path = "autocomplete/_hyperfine.ps1"
    refreshPeriod = {{ $default_refresh }}
{{ end }}

{{ if and (eq .chezmoi.os "linux") (not .is_desktop) }}
# tmux plugins, pinned to release tags AND to a checksum.sha256 of the exact
# tarball. The tag encodes the version (mirroring flake.lock for nix tools);
# the checksum upgrades that to a byte-exact, tamper-evident pin, so a moved
# tag or altered tarball fails the fetch loudly instead of silently changing.
# The flip side: if GitHub ever regenerates an auto-tarball differently, the
# fetch fails until the hash is refreshed (recompute: curl -fsSL <url> |
# sha256sum). exact = true also prunes files a version bump would otherwise
# leave behind. When bumping a plugin, update its tag/SHA and its checksum
# together. mode-indicator below, which publishes no tags, pins to a SHA out of
# necessity. .tmux.conf loads each one directly via run-shell; they resolve
# their own dir self-relatively and make no runtime git calls, so a plain
# archive works.
[".tmux/plugins/catppuccin"]
    type = "archive"
    url = "https://github.com/catppuccin/tmux/archive/refs/tags/v2.3.0.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "6072ac982aaba71a1ee2a4780a2b5debecfb272857d6ae2ffb9b52649ee07b1a"
    refreshPeriod = {{ $default_refresh }}

[".tmux/plugins/tmux-resurrect"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-resurrect/archive/refs/tags/v4.0.0.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "f8559d86d81be769054d63b28a268229a09bc6cc311f0623656c3090ec781b76"
    refreshPeriod = {{ $default_refresh }}

[".tmux/plugins/tmux-continuum"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tmux-continuum/archive/refs/tags/v3.1.0.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "311dddeebbf7b803cd19c339ab887784b715fd8ef206ec430028cabb8574de87"
    refreshPeriod = {{ $default_refresh }}

# mode-indicator publishes no tags (dormant since 2021), so it pins to a
# commit SHA instead — GitHub serves an archive tarball for any commit, so
# taglessness is no obstacle. Pure shell; previously came from nixpkgs.
[".tmux/plugins/mode-indicator"]
    type = "archive"
    url = "https://github.com/MunifTanjim/tmux-mode-indicator/archive/7027903adca37c54cb8f5fa99fc113b11c23c2c4.tar.gz"
    stripComponents = 1
    exact = true
    checksum.sha256 = "28be6faf8f6c8f3b916bf901c1f1b269fa52d23372a38f192533352c1bf4ebd7"
    refreshPeriod = {{ $default_refresh }}
{{ end }}

{{ if and (eq .chezmoi.os "linux") .is_desktop }}
# Icon-only Nerd Font, fallback for glyphs missing from MesloLGS NF.
# macOS gets it from the font-symbols-only-nerd-font cask in packages.yaml.
[".local/share/fonts/SymbolsNerdFontMono-Regular.ttf"]
    type = "archive-file"
    url = "{{ gitHubLatestReleaseAssetURL "ryanoasis/nerd-fonts" "NerdFontsSymbolsOnly.tar.xz" }}"
    path = "SymbolsNerdFontMono-Regular.ttf"
    refreshPeriod = {{ $default_refresh }}

# Powerlevel10k-recommended MesloLGS NF (Powerline + small Nerd Font subset).
# romkatv/powerlevel10k-media is a fonts-only mirror; no tagged releases exist.
[".local/share/fonts/MesloLGS NF Regular.ttf"]
    type = "file"
    url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf"
    refreshPeriod = {{ $default_refresh }}

[".local/share/fonts/MesloLGS NF Bold.ttf"]
    type = "file"
    url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold.ttf"
    refreshPeriod = {{ $default_refresh }}

[".local/share/fonts/MesloLGS NF Italic.ttf"]
    type = "file"
    url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Italic.ttf"
    refreshPeriod = {{ $default_refresh }}

[".local/share/fonts/MesloLGS NF Bold Italic.ttf"]
    type = "file"
    url = "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Bold%20Italic.ttf"
    refreshPeriod = {{ $default_refresh }}
{{ end }}

["{{ printf ".local/bin/tree-sitter%s" $binary_suffix }}"]
    type = "file"
    decompress = "gzip"
    url = "{{ gitHubLatestReleaseAssetURL "tree-sitter/tree-sitter" (printf "tree-sitter-%s-%s.gz" (.chezmoi.os | replace "darwin" "macos") (.chezmoi.arch | replace "amd64" "x64")) }}"
    executable = true
    refreshPeriod = {{ $default_refresh }}
