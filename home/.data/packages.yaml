# AI agent plugins. One entry per logical plugin; the per-agent keys are
# install methods for the SAME plugin, exactly like brew-cask/deb/winget are
# for an OS package. Consumed by unix/run_onchange_after_76-install-agent-plugins.
#   claude-plugin: / codex-plugin:  "<plugin>@<marketplace>"; the marketplace
#                                   named after the @ is added first, from
#                                   agent-marketplace:.
#   omp-plugin:                     npm spec or `git:` ref — omp has no
#                                   marketplace, it installs the package direct.

# Audit and maintain CLAUDE.md files. Claude-only by nature — there is no
# codex/omp analogue of CLAUDE.md to manage.
- claude-plugin: claude-md-management@claude-plugins-official
  agent-marketplace: anthropics/claude-plugins-official

# Multi-agent PR review with confidence-based scoring to filter false
# positives, plus the `ultra` cloud mode. ~20 tok always-on, the cheapest thing
# in the set, and a different mechanism from pr-review-toolkit's subagent
# fan-out rather than a duplicate of it — worth carrying both.
- claude-plugin: code-review@claude-plugins-official
  agent-marketplace: anthropics/claude-plugins-official

# Official GitHub MCP server: issues, PRs, code review, search. Claude-only
# here on purpose — codex ships its own GitHub integration, and wiring this one
# in would mean re-adding the whole 290-plugin claude-plugins-official snapshot
# to codex for a single entry.
- claude-plugin: github@claude-plugins-official
  agent-marketplace: anthropics/claude-plugins-official

# Biases the agent toward writing less code. Ships adapters for 14 harnesses;
# omp is the Pi harness, which takes the npm package rather than a marketplace.
- claude-plugin: ponytail@ponytail
  codex-plugin: ponytail@ponytail
  omp-plugin: "@dietrichgebert/ponytail"
  agent-marketplace: DietrichGebert/ponytail

# Six specialist review agents (code-reviewer, comment-analyzer,
# pr-test-analyzer, silent-failure-hunter, type-design-analyzer,
# code-simplifier) fanned out from one /review-pr command. Its code-simplifier
# agent is a longer rewrite of the standalone code-simplifier plugin's (5292 vs
# 3129 bytes, same agent name), which is why that plugin is deliberately NOT
# declared and was uninstalled: two agents of one name, no upside.
#
# Costs ~2,033 tok always-on — six agent descriptions sit in context on every
# session, ~100x code-review's ~20. Carried knowingly, for the four specialists
# nothing else here provides: silent-failure-hunter, comment-analyzer,
# pr-test-analyzer, type-design-analyzer.
- claude-plugin: pr-review-toolkit@claude-plugins-official
  agent-marketplace: anthropics/claude-plugins-official

# Pyright language server for Python. Claude-only: it plugs into Claude Code's
# own LSP component type, which codex and omp do not share.
- claude-plugin: pyright-lsp@claude-plugins-official
  agent-marketplace: anthropics/claude-plugins-official

# Process skills: TDD, systematic debugging, verification before completion.
# Codex ships its own copy via the bundled openai-curated marketplace, but only
# where that marketplace exists — the Coder workspace's codex has just the
# marketplaces we add, so relying on it left the container without superpowers
# entirely. Declare it from claude-plugins-official (which resolves to the same
# obra/superpowers upstream omp installs) so every host converges on one source,
# and remove the openai-curated copy where it was pre-installed:
#     codex plugin remove superpowers@openai-curated
- claude-plugin: superpowers@claude-plugins-official
  codex-plugin: superpowers@claude-plugins-official
  omp-plugin: "git:github.com/obra/superpowers"
  agent-marketplace: anthropics/claude-plugins-official
