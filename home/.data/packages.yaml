# Neovim formatters & linters — installed fleet-wide so conform.nvim
# (format-on-save) and nvim-lint find them on PATH. Consumers:
# home/dot_config/nvim/lua/plugins/{conform,nvim-lint}.lua.
# (python→ruff, nix→nixfmt, rust→rustfmt live under their own entries.)
- nix: stylua                   # lua formatter
- nix: luajitPackages.luacheck  # lua linter (LuaJIT dialect, matches nvim)
- nix: shfmt                    # sh / bash formatter
- nix: shellcheck               # sh / bash linter (pre-commit shell checks)
- nix: prettier                 # yaml / json / markdown formatter
- nix: taplo                    # toml formatter
- nix: gotools                  # provides goimports (go import organizer)

# Neovim LSP servers & linters formerly installed per-machine via
# mason.nvim. Moved to declarative packages so they're version-pinned
# fleet-wide (flake.lock) like everything else. macOS/Linux: nix.
# Windows (no nixpkgs): winget for lua_ls, npm for the node servers (no
# winget/scoop package exists), uv for yamllint. Consumers: nvim's
# config.lsp (executable-gated vim.lsp.enable) + nvim-lint.
- nix: lua-language-server
  winget: LuaLS.lua-language-server
- nix: bash-language-server
  npm-win: bash-language-server   # npm-only; no winget/scoop package
- nix: yaml-language-server
  npm-win: yaml-language-server   # npm-only; no winget/scoop package
- nix: yamllint                   # yaml linter (nvim-lint)
  uv-tool: yamllint               # Windows: PyPI via uv
- nix: markdownlint-cli2          # markdown linter (nvim-lint)
  npm-win: markdownlint-cli2      # npm-only; no winget/scoop package

