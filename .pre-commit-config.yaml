repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        # chezmoi names a `modify_` script after the target it rewrites, so the
        # status-line script has to be called modify_settings.json even though
        # it is bash, not JSON.
        exclude: ^home/.*/modify_[^/]*\.json$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # This repo is public. detect-private-key catches a PEM/OpenSSH private
      # key pasted in by mistake; the size cap catches a keyring, a database or
      # an archive dragged in whole. Neither can be undone once pushed.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict

  # Lua tooling for the Neovim config. system hooks reuse the nix-installed
  # binaries (from .data/packages.yaml) so pre-commit and the editor share
  # one version. stylua reads home/dot_config/nvim/stylua.toml; luacheck
  # reads the repo-root .luacheckrc.
  - repo: local
    hooks:
      - id: stylua
        name: stylua (check)
        entry: stylua --check
        language: system
        types: [lua]
        files: ^home/dot_config/nvim/.*\.lua$
      - id: luacheck
        name: luacheck
        entry: luacheck
        language: system
        types: [lua]
        files: ^home/dot_config/nvim/.*\.lua$
      - id: nvim-tests
        name: nvim config tests
        entry: tests/nvim/run.sh
        language: system
        pass_filenames: false
        files: ^(home/dot_config/nvim/.*\.lua|tests/nvim/.*)$

      # zsh -n on the zsh config, shellcheck on rendered chezmoi shell scripts,
      # and a tmux -f syntax smoke test (shellcheck/tmux self-skip if absent).
      - id: shell-checks
        name: shell + tmux syntax checks
        entry: tests/shell/run.sh
        language: system
        pass_filenames: false
        files: ^(home/dot_config/zsh/.*\.(zsh|tmpl)|home/dot_z[a-z]*(\.tmpl)?|home/\.chezmoiscripts/.*\.sh\.tmpl|home/dot_tmux\.conf\.tmpl|tests/shell/.*)$

      # The Telegram notifier against a fake curl: receipt output, exit codes,
      # nothing from the reply or the token leaking. Never sends a message.
      - id: notify-tests
        name: omp-notify notifier tests
        entry: tests/notify/run.sh
        language: system
        pass_filenames: false
        files: ^(home/dot_config/omp-notify/.*|tests/notify/.*)$

      # The agent-workflow services launcher and the old CGT name that forwards
      # to it, against a fake services.py in a bare env -i shell. Starts nothing.
      - id: services-tests
        name: agent-workflow services launcher tests
        entry: tests/services/run.sh
        language: system
        pass_filenames: false
        files: ^(home/bin/executable_(agent-workflow-services\.tmpl|cgt-dispatcher-supervise)|tests/services/.*)$
